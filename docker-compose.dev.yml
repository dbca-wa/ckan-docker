volumes:
  ckan_storage:
  pg_data:
  solr_data:
  pip_cache:
  site_packages:
  local_bin:

services:

  ckan-dev:
    platform: linux/amd64
    build:
      context: ckan/
      dockerfile: Dockerfile.dev
      args:
        - TZ=${TZ}
    image: ${COMPOSE_PROJECT_NAME}-ckan-dev
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "0.0.0.0:${CKAN_PORT_HOST}:5000"
    volumes:
      - ckan_storage:/var/lib/ckan
      - ./src:/srv/app/src_extensions
      - pip_cache:/root/.cache/pip
      - site_packages:/usr/local/lib/python3.10/site-packages
      - local_bin:/usr/local/bin
      - ./ckan/config:/srv/app/config
      - ./logs:/srv/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:5000"]
      interval: 60s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "${LAGOON_LOCALDEV_URL}:host-gateway"

  ckan-dev-worker:
    platform: linux/amd64
    build:
      context: ckan/
      dockerfile: Dockerfile.worker
      additional_contexts:
        ckan: "service:ckan-dev"
      args:
        - TZ=${TZ}
    env_file:
      - .env
    environment:
      # Worker inherits these via the shared env_file above; Pygmy's docker-gen routes
      # to any exposed-port container carrying them (worker has one via the ckan-dev
      # base image), causing a route collision the moment Pygmy is running — even
      # without docker-compose.pygmy.yml. Blank them so only ckan-dev is ever routed.
      LAGOON_LOCALDEV_URL: ""
      LAGOON_LOCALDEV_HTTP_PORT: ""
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy
      ckan-dev:
        condition: service_started
    volumes:
      - ckan_storage:/var/lib/ckan
      - ./src:/srv/app/src_extensions
      - pip_cache:/root/.cache/pip
      - site_packages:/usr/local/lib/python3.10/site-packages
      - local_bin:/usr/local/bin
      - ./ckan/config:/srv/app/config
      - ./logs:/srv/app/logs
      - ./spatial_data:/srv/app/spatial_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl", "status"]
      interval: 60s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "${LAGOON_LOCALDEV_URL}:host-gateway"

  db:
    build:
      context: postgresql/
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - CKAN_DB_USER
      - CKAN_DB_PASSWORD
      - CKAN_DB
      - DATASTORE_READONLY_USER
      - DATASTORE_READONLY_PASSWORD
      - DATASTORE_DB
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
    ports:
      - :5432

  solr:
    platform: linux/amd64
    image: ckan/ckan-solr:${SOLR_IMAGE_VERSION}
    volumes:
      - solr_data:/var/solr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8983/solr/"]
    ports:
      - :8983

  redis:
    image: redis:${REDIS_VERSION}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "QUIT"]
