name: Create and publish a Docker image

on:
  # Trigger the workflow on push on master, develop and tags
  push:
    branches:
      - master
      - develop
    tags:
      - "*"
  # Trigger the workflow manually
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pin the ckanext-dbca ref per build. Release refs (master branch or any
      # git tag) use the CKANEXT_DBCA_REF repo variable — set it to an immutable
      # tag/SHA at release time — falling back to master if unset. Everything else
      # (develop and feature branches) tracks the develop branch.
      - name: Determine ckanext-dbca ref
        id: dbca_ref
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.ref_name }}" = "master" ]; then
            echo "ref=${{ vars.CKANEXT_DBCA_REF || 'master' }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (tags, labels) for Docker ckan image
        id: meta_ckan
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ckan

      - name: Extract metadata (tags, labels) for Docker ckan worker image
        id: meta_ckan_worker
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ckan-worker

      - name: CKAN Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./ckan
          file: ./ckan/Dockerfile
          push: true
          tags: ${{ steps.meta_ckan.outputs.tags }}
          build-args: |
            CKANEXT_DBCA_REF=${{ steps.dbca_ref.outputs.ref }}

      # meta_ckan.outputs.tags is a newline-separated list that can contain
      # multiple tags (e.g. on a tag push). Resolve a single concrete image ref
      # for the worker's `ckan` build-context (FROM ckan) and the Trivy scan below.
      - name: Extract first tag
        id: extract_first_tag
        env:
          CKAN_TAGS: ${{ steps.meta_ckan.outputs.tags }}
        run: echo "first_tag=$(echo "$CKAN_TAGS" | head -n1)" >> "$GITHUB_OUTPUT"

      - name: CKAN Worker Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./ckan
          file: ./ckan/Dockerfile.worker
          push: true
          tags: ${{ steps.meta_ckan_worker.outputs.tags }}
          build-contexts: ckan=docker-image://${{ steps.extract_first_tag.outputs.first_tag }}

      - name: Use first tag
        run: echo "Using CKAN image ref ${{ steps.extract_first_tag.outputs.first_tag }}"

      - name: Run Trivy vuln scanner on CKAN image
        uses: aquasecurity/trivy-action@0.35.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
        with:
          scan-type: "image"
          image-ref: ${{ steps.extract_first_tag.outputs.first_tag }}
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
