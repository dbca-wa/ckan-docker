# Optional override for local SAML testing via Pygmy (Salsa-internal, not required for
# normal local dev). Layer on top of docker-compose.dev.yml:
#   docker compose -f docker-compose.dev.yml -f docker-compose.pygmy.yml up -d
#
# Joins ckan-dev to Pygmy's amazeeio-network so its haproxy can route
# http://ckan-dbca.docker.amazee.io (port 80) to this container. Requires Pygmy running
# (https://github.com/pygmystack/pygmy) — the amazeeio-network must already exist, which
# is why this isn't in docker-compose.dev.yml itself: referencing a non-existent external
# network breaks `docker compose up` for everyone without Pygmy installed.
services:
  ckan-dev:
    networks:
      - default
      - amazeeio-network
    environment:
      LAGOON_ROUTE: http://${LAGOON_LOCALDEV_URL}
      LAGOON_LOCALDEV_HTTP_PORT: 5000

networks:
  amazeeio-network:
    external: true
